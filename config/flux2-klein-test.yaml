---
job: "train"
config:
  name: "KNHB-flux2-klein"
  training_folder: "output"
  process:
    - type: "sd_trainer"
      sqlite_db_path: "/root/ai-toolkit/aitk_db.db"
      device: "cuda"
      trigger_word: "<knhb-style>"
      performance_log_every: 100

      network:
        type: "lora"
        linear: 64
        linear_alpha: 64
        conv: 16
        conv_alpha: 16
        lokr_full_rank: true
        lokr_factor: -1
        network_kwargs:
          ignore_if_contains: []

      save:
        dtype: "bf16"
        save_every: 250
        max_step_saves_to_keep: 4
        save_format: "diffusers"
        push_to_hub: false

      datasets:
        - folder_path: "/root/modal_output/datasets/KNHB"
          mask_path: null
          mask_min_value: 0.1
          default_caption: "An illustration of Pokemon, <knhb-style>"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          token_dropout_rate: 0.0
          shuffle_tokens: false
          keep_tokens: 4
          cache_latents_to_disk: true
          is_reg: false
          network_weight: 1
          resolution: [512, 768, 1024, 1280]
          controls: []
          shrink_video_to_frames: true
          num_frames: 1
          do_i2v: true
          flip_x: false
          flip_y: false

      train:
        batch_size: 1
        bypass_guidance_embedding: false
        steps: 3000
        gradient_accumulation: 4
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        timestep_type: "weighted"
        content_or_style: "content"
        optimizer_params:
          weight_decay: 0.0001
        unload_text_encoder: false
        cache_text_embeddings: false
        lr: 4e-5
        lr_scheduler: "cosine"
        lr_scheduler_params:
          total_iters: 3000
          warmup_steps: 150
        ema_config:
          use_ema: true
          ema_decay: 0.995
        skip_first_sample: true
        force_first_sample: false
        disable_sampling: false
        dtype: "bf16"
        diff_output_preservation: true
        diff_output_preservation_multiplier: 1
        diff_output_preservation_class: "pokemon"
        switch_boundary_every: 1
        loss_type: "mse"
        max_grad_norm: 1.0

      model:
        name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
        arch: "flux2_klein"
        quantize: false
        quantize_te: false
        dtype: "bf16"
        low_vram: false
        model_kwargs: {}

      sample:
        sampler: "flowmatch"
        sample_every: 250
        width: 1024
        height: 1024
        prompts:
          - "Dragonite and Tatsugiri delivering a package together, matching postman outfits, village background, <knhb-style>"
          - "a close-up of Dragonite holding a white game controller, <knhb-style>"
        neg: ""
        seed: 149
        walk_seed: true
        guidance_scale: 3.0
        sample_steps: 30
        num_frames: 1
        fps: 1

meta:
  name: "[name]"
  version: "1.0"
